# Experiment manifest -- single source of truth for tool versions, model
# snapshots, dataset ids, RNG seeds, hyperparameters, and hardware for the
# paper "Not All 4-bit Quantizers Are Equal". Every reported number is
# regenerable from this manifest plus the committed seeds.

manifest_version: 2
project: quantizer-pii-mitigation

repo:
  origin: https://github.com/CristhianKapelinski/quantizer-pii-mitigation
  branch: master

# ---------------------------------------------------------------------------
# Toolchain -- pinned in pyproject.toml / uv.lock; this is the human summary.
# ---------------------------------------------------------------------------
toolchain:
  python: "3.11"
  cuda_runtime_min: "12.4"
  packages:
    torch: "2.7.1"           # +cu128, required for sm_120 Blackwell
    transformers: "4.46.3"
    peft: "0.13.2"
    accelerate: "1.1.1"
    autoawq: "0.2.7"         # AWQ-INT4 quantization + inference
    auto-gptq: "0.7.1"       # GPTQ-INT4 quantization + inference
    bitsandbytes: "0.44.1"   # pinned but unused / disabled (broken on torch 2.7+cu128)
  analysis_only:             # needed by replay.sh (no GPU)
    numpy: "*"
    scipy: "*"
    matplotlib: "*"
  llama_cpp:
    repo: https://github.com/ggerganov/llama.cpp
    tag: b4404
    commit: 0827b2c1da299805288abbd556d869318f2b121e
    build_script: scripts/build_llama_cpp.sh
    build_flags: "-DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DGGML_NATIVE=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TESTS=OFF"
    binaries: [llama-cli, llama-quantize, llama-perplexity, llama-imatrix]
    note: "CPU-only build (all GPU work is PyTorch). Build with --portable on a non-Zen4 host to avoid a native-arch SIGILL."

# ---------------------------------------------------------------------------
# Models -- five open-weight SLM backbones, 0.5B--7B.
# ---------------------------------------------------------------------------
models:
  qwen2.5-0.5b-instruct:
    hf_id: Qwen/Qwen2.5-0.5B-Instruct
    role: cross-family small scale (full FT + LoRA)
  llama-3.2-1b-instruct:
    hf_id: meta-llama/Llama-3.2-1B-Instruct
    mirror_hf_id: unsloth/Llama-3.2-1B-Instruct   # meta is gated; unsloth mirror used
    role: depth anchor -- 5-seed full FT (mechanism / MIA / ablation pool) + LoRA
  qwen2.5-1.5b-instruct:
    hf_id: Qwen/Qwen2.5-1.5B-Instruct
    role: cross-family mid scale (full FT)
  llama-3.2-3b-instruct:
    hf_id: meta-llama/Llama-3.2-3B-Instruct
    role: scale anchor (full FT, single seed; LoRA 3-seed) -- full FT needs A100 80 GB
  qwen2.5-7b-instruct:
    hf_id: Qwen/Qwen2.5-7B-Instruct
    role: production-scale anchor (full FT, single seed) -- needs A100 80 GB

# ---------------------------------------------------------------------------
# Datasets.
# ---------------------------------------------------------------------------
datasets:
  enron:
    source: huggingface
    hf_id: snoop2head/enron_aeslc_emails
    license: enron-public
    notes: "Host corpus -- 3000 emails; training set 6575 records. Held-out partition supplies the in-distribution MIA non-members and the natural-canary mining pool."
  g2_wikipedia:
    source: huggingface
    hf_id: wikipedia
    config: "20220301.simple"
    license: cc-by-sa-3.0
    notes: "Control group G2 (in-distribution baseline), 50 sequences; NOT inserted into training."
  g3_synthetic:
    source: qquilt.groups._g3_synthetic
    revision: "seed-deterministic"
    notes: "Control group G3 (synthetic OOD), 50 sequences -- the prior-work MIA non-member set; NOT inserted."
  wikitext2:
    source: huggingface
    hf_id: wikitext
    config: wikitext-2-raw-v1
    notes: "OOD perplexity evaluation (Table tab:utility) and the WikiText AWQ-calibration cell (Table tab:saliency)."

# ---------------------------------------------------------------------------
# Canaries -- planted synthetic PII, per Carlini-style canary protocol.
# ---------------------------------------------------------------------------
canaries:
  n_per_seed: 100
  buckets: {3: 25, 10: 25, 30: 25, 100: 25}   # duplication frequency K
  template: structured email; high-entropy 10-char reference, 12-digit account, date
  generation: deterministic from seed (no real PII)

# ---------------------------------------------------------------------------
# Fine-tuning -- common recipe across all (backbone, regime) cells.
# ---------------------------------------------------------------------------
hyperparams:
  finetune:
    epochs: 5
    learning_rate: 2.0e-5            # LoRA delta-knob cell uses 2.0e-4
    effective_batch_size: 16
    max_seq_len: 512
    precision: bf16
    grad_checkpointing: true
    optimizer: adamw                 # Llama-3.2-1B full FT anchor
    optimizer_qwen_and_big: adafactor # Qwen cells + 3B/7B full FT (AdamW state OOMs on 16 GB / fits-budget)
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    merged_before_quantization: true
  extraction:
    probe: greedy continuation from the deterministic canary prefix
    primary_metric: prefix-match-length >= 10 chars (the 10-char reference field)
    stochastic: any-of-n=6 (Hayes-style); stronger stress test up to any-of-100
  quantizers:
    gguf_kquant: [q8_0, q5_k_m, q4_k_m, q4_k_s, q3_k_m, q2_k]   # calibration-corpus-free, via llama.cpp
    awq_4bit: {tool: autoawq, group_size: 128, sweep: [32, 64, 128], calibration: 128 x 512-token Enron chunks}
    gptq_4bit: {tool: auto_gptq, group_size: 128, calibration: 128 x 512-token Enron chunks}

# ---------------------------------------------------------------------------
# Random seeds.
# ---------------------------------------------------------------------------
seeds:
  llama_3.2_1b_full_ft: [42, 52, 62, 72, 82]   # 5-seed depth anchor
  qwen_0.5b_full_ft:    [42, 52, 62]
  qwen_1.5b_full_ft:    [42, 52, 62]
  lora_cells:           [42, 52, 62]           # 0.5B / 1B / 3B LoRA r=16
  lora_3b_delta_knob:   [42]                   # lr 2e-4 single-seed
  llama_3.2_3b_full_ft: [42]
  qwen_7b_full_ft:      [42]
  mechanism_pool:       [42, 52, 62]           # 3-seed Recall-position FLIP pool

# ---------------------------------------------------------------------------
# Hardware on which the committed numbers were produced. Reproduction does
# not require these specific GPUs.
# ---------------------------------------------------------------------------
hardware:
  primary:
    gpu: NVIDIA GeForce RTX 5060 Ti
    vram_gb: 16
    note: "runs 0.5B/1B/1.5B full FT, all LoRA cells, and every ablation"
  secondary:
    gpu: NVIDIA GeForce RTX 3060
    vram_gb: 12
    note: "optional -- runs the 0.5B/1.5B cross-family pieces in parallel; not required"
  big_model:
    gpu: NVIDIA A100 80 GB
    note: "rented pod -- only the Llama-3.2-3B and Qwen2.5-7B full-FT cells"
