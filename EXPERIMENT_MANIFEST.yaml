# Quantization Quilt — Experiment Manifest
#
# Single source of truth for tool versions, model snapshots, dataset SHAs,
# hyperparameters, RNG seeds, and hardware fingerprints. Every run writes a
# resolved copy of this manifest into its output directory. The paper cites
# this file by repo commit hash. (ENGINEERING.md §4.2.)

manifest_version: 1
project: quantization-quilt

repo:
  origin: https://github.com/<owner>/quantization-quilt
  branch: main
  commit: TBD                # filled at run time by scripts/freeze_manifest.sh

# ---------------------------------------------------------------------------
# Toolchain — pinned per PLAN.md §3 / §9 and ENGINEERING.md §4.1.
# ---------------------------------------------------------------------------
toolchain:
  python: "3.11"
  cuda_runtime_min: "12.4"
  packages:
    torch: "2.7.1"           # bumped from PLAN.md §9 (2.5.1) for sm_120 Blackwell
    transformers: "4.46.3"
    peft: "0.13.2"
    accelerate: "1.1.1"
    autoawq: "0.2.7"         # wave 1+ (quant extra) — works on torch 2.7+cu128
    bitsandbytes: "0.44.1"   # quant extra; broken on torch 2.7+cu128 — bump to ≥0.47 before W1 full G5
    auto-gptq: "0.7.1"       # quant extra; pulls intel-extension-for-pytorch w/ torch 2.8 hard-pin warning
    opacus: ">=1.5,<2"       # dp extra (W1 full G5 + W3 DP-SGD sweep)
    unsloth: "DROPPED"        # PLAN §9 pin 2025.10.12 incompatible with transformers 4.46.3
  journal:
    - experiment/journal/2026-05-09-torch-blackwell.md
    - experiment/journal/2026-05-09-pin-conflict.md
    - experiment/journal/2026-05-10-bitsandbytes-cu128.md
  llama_cpp:
    repo: https://github.com/ggerganov/llama.cpp
    tag: b4404
    commit: 0827b2c1da299805288abbd556d869318f2b121e
    build_script: scripts/build_llama_cpp.sh
    build_flags: "-DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DGGML_NATIVE=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TESTS=OFF"
    binaries:
      - llama-cli
      - llama-quantize
      - llama-perplexity
      - llama-imatrix
    note: "CPU-only build (llama.cpp never touches CUDA in this repo — all GPU work is PyTorch). The committed numbers used a native build (-march=native) on a Zen4 host; build with `scripts/build_llama_cpp.sh --portable` if running the same checkout on a different CPU (a native binary can SIGILL across micro-archs — see experiment/journal/2026-05-10-gpu2-llama-cli-sigill.md)."

# ---------------------------------------------------------------------------
