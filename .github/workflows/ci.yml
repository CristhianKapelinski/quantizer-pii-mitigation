name: CI

# Runs the reviewer's own path on a clean runner. The point is not the code: it
# is that the exact commands the README gives a reviewer keep working on a
# machine with none of the author's state, and that the README keeps telling the
# truth about what they print.
#
# reproduce.sh is deliberately not here: it needs an NVIDIA GPU and downloads
# model weights, neither of which a hosted runner has.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  reviewer-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up the pinned Python and dependencies
        run: uv sync --no-install-project --extra dev

      - name: Unit tests (no GPU, no network)
        run: uv run --extra dev python -m pytest -q tests

      - name: Minimal Test -- the command the README opens with
        run: bash replay.sh --figures-only

      - name: Claim #1 Option B -- full replay, gated on every published value
        run: bash replay.sh

      - name: The committed run of record must be untouched
        run: |
          if ! git diff --quiet -- expected/ experiment/results/; then
            echo "The replay rewrote committed inputs or expected values." >&2
            git --no-pager diff --stat -- expected/ experiment/results/ >&2
            exit 1
          fi
          echo "expected/ and experiment/results/ are unchanged"

      - name: Publish the regenerated paper figure
        uses: actions/upload-artifact@v4
        with:
          name: paper-figure
          path: experiment/figures/
