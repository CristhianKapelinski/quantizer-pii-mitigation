name: CI

# Runs the reviewer's own path on a clean runner: the unit suite and the full
# offline replay, which re-derives every table and figure from the committed
# logs and fails unless all 141 published values match the paper.
#
# Deliberately light. torch is a core dependency of the project, but neither the
# replay nor the unit tests import it, so the job installs only the numerics
# stack instead of pulling ~2.5 GB of CUDA wheels on every run. reproduce.sh is
# not here either: it needs an NVIDIA GPU and downloads model weights.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  reviewer-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Numerics stack only, at the project's declared bounds
        run: |
          uv venv --python 3.11
          uv pip install "numpy>=1.26,<2" "scipy>=1.13,<2" "statsmodels>=0.14,<1" \
                         "matplotlib>=3.8" "click>=8.1" pytest

      - name: Unit tests (no GPU, no network)
        run: .venv/bin/python -m pytest -q tests

      - name: Minimal Test -- the command the README opens with
        run: bash replay.sh --figures-only

      - name: Claim #1 Option B -- full replay, gated on every published value
        run: bash replay.sh

      - name: The committed run of record must be untouched
        run: |
          if ! git diff --quiet -- expected/ experiment/results/; then
            echo "The replay rewrote committed inputs or expected values." >&2
            git --no-pager diff --stat -- expected/ experiment/results/ >&2
            exit 1
          fi
          echo "expected/ and experiment/results/ are unchanged"

      - name: Publish the regenerated paper figure
        uses: actions/upload-artifact@v4
        with:
          name: paper-figure
          path: experiment/figures/
