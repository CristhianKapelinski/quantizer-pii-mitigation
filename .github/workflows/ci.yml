name: CI

# READ THIS FIRST: THIS WORKFLOW DOES NOT RUN.
#
# The artifact is hosted on GitLab
# (gitlab.com/cristhianavila.aluno/quantizer-pii-mitigation). GitLab CI reads
# .gitlab-ci.yml and ignores .github/ entirely, and this repository has no
# .gitlab-ci.yml, so nothing here is executed on push, on a schedule, or at all.
# The file is kept because it is an exact, executable description of the reviewer
# path -- a clean machine, the numerics stack only, and every gate the README
# promises -- and because the artifact was developed on GitHub, where it did run.
# Read the `steps:` below as the checklist; do not read the badgeless silence of
# this repository as those steps having passed somewhere.
#
# To run the same thing yourself, from a fresh clone:
#
#     uv sync --only-group replay
#     .venv/bin/python -m pytest -q tests
#     bash replay.sh --figures-only
#     bash replay.sh
#     git status --porcelain            # must print nothing
#
# Deliberately light. torch is a core dependency of the project, but neither the
# replay nor the unit tests import it, so the job installs only the numerics
# stack instead of pulling ~2.5 GB of CUDA wheels on every run. reproduce.sh is
# not here either: it needs an NVIDIA GPU and downloads model weights.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  reviewer-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Numerics stack only, from the pyproject `replay` group
        run: |
          uv sync --only-group replay

      - name: Unit tests (no GPU, no network)
        run: .venv/bin/python -m pytest -q tests

      - name: Minimal Test -- the command the README opens with
        run: bash replay.sh --figures-only

      - name: Claim #1 Option B -- full replay, gated on every published value
        run: bash replay.sh

      - name: The committed run of record must be untouched
        run: |
          if ! git diff --quiet -- expected/ experiment/results/; then
            echo "The replay rewrote committed inputs or expected values." >&2
            git --no-pager diff --stat -- expected/ experiment/results/ >&2
            exit 1
          fi
          echo "expected/ and experiment/results/ are unchanged"

      - name: Publish the regenerated paper figure
        uses: actions/upload-artifact@v4
        with:
          name: paper-figure
          path: experiment/figures/
