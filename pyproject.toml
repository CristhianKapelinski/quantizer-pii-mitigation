[project]
name = "quantizer-pii-mitigation"
version = "0.1.0"
description = "Deployment-time mitigation of PII leakage in fine-tuned small language models via the choice of 4-bit quantizer"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Cristhian Kapelinski", email = "cristhianavila.aluno@unipampa.edu.br" },
    { name = "Diego Kreutz", email = "diegokreutz@unipampa.edu.br" },
]
readme = "README.md"

dependencies = [
    # Core ML stack.
    # torch is pinned to 2.7.1 from the cu128 index: the reference GPU is an
    # RTX 5060 Ti (sm_120, Blackwell), and PyTorch only ships Blackwell wheels
    # from 2.7 onwards.
    "torch==2.7.1",
    "transformers==4.46.3",
    "peft==0.13.2",
    "accelerate==1.1.1",
    "tokenizers>=0.20,<0.21",
    "safetensors>=0.4,<0.5",
    "huggingface-hub>=0.25,<0.27",
    "datasets>=3.0,<4.0",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=4.25,<6",
    # Numerics + utilities.
    "numpy>=1.26,<2",
    "pandas>=2.0,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14,<1",
    "pyyaml>=6.0,<7",
    "jsonlines>=4.0,<5",
    "tqdm>=4.66,<5",
    "click>=8.1,<9",
    # Analysis / replay path (figures + statistics; no GPU).
    "matplotlib>=3.8,<4",
    "sentence-transformers>=3.0,<4",
    # Downstream task-level utility evaluation (prose sec:utility):
    # arc_easy / hellaswag / winogrande via lm-evaluation-harness.
    # Used by scripts/exp_downstream_utility.sh.
    "lm-eval>=0.4.0,<0.5",
]

[project.optional-dependencies]
# Needed by the from-scratch path (reproduce.sh) to produce the AWQ and GPTQ
# models: `uv sync --no-install-project --extra quant`. The replay path does
# not need them.
quant = [
    "bitsandbytes==0.44.1",
    "autoawq==0.2.7",
    "auto-gptq==0.7.1",
]
# DP-SGD baseline (src/qquilt/dp_sgd.py); not part of either reproduction path.
dp = [
    "opacus>=1.5,<2",
]
dev = [
    "ruff>=0.6,<1",
    "pyright>=1.1,<2",
    "pytest>=8,<9",
]
mechanism = [
    "llama-cpp-python==0.3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qquilt"]

[tool.uv]
managed = true

[[tool.uv.index]]
# torch 2.7+ Blackwell wheels live in the cu128 index (RTX 5060 Ti = sm_120).
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests"]
