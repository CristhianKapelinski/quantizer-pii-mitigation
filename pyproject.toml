[project]
name = "quantization-quilt"
version = "0.1.0"
description = "Multi-Version Compression Comparison Attack on open-weight LLM releases"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Cristhian Kapelinski", email = "cristhiank552@gmail.com" }]
readme = "README.md"

dependencies = [
    # Core ML stack.
    # NOTE: PLAN.md §9 originally pinned torch==2.5.1, but the RTX 5060 Ti
    # is sm_120 (Blackwell) and PyTorch only added Blackwell wheels in 2.7.
    # Bumped to torch==2.7.1 with the cu128 index. See
    # experiment/journal/2026-05-09-torch-blackwell.md.
    "torch==2.7.1",
    "transformers==4.46.3",
    "peft==0.13.2",
    "accelerate==1.1.1",
    "tokenizers>=0.20,<0.21",
    "safetensors>=0.4,<0.5",
    "huggingface-hub>=0.25,<0.27",
    "datasets>=3.0,<4.0",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=4.25,<6",
    # Numerics + utilities.
    "numpy>=1.26,<2",
    "pandas>=2.0,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "pyyaml>=6.0,<7",
    "jsonlines>=4.0,<5",
    "tqdm>=4.66,<5",
    "click>=8.1,<9",
]

[project.optional-dependencies]
quant = [
    "bitsandbytes==0.44.1",
    "autoawq==0.2.7",
    "auto-gptq==0.7.1",
]
dp = [
    "opacus>=1.5,<2",
]
# Note: unsloth==2025.10.12 from PLAN.md §9 requires transformers>=4.51.3,
# which conflicts with the transformers==4.46.3 pin. Unsloth is a perf
# optimization, not a correctness requirement — W0 uses plain HF Trainer.
# Re-pin unsloth alongside a compatible transformers bump before W1 if
# the speedup is needed. See experiment/journal/2026-05-09-pin-conflict.md.
dev = [
    "ruff>=0.6,<1",
    "pyright>=1.1,<2",
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qquilt"]

[tool.uv]
managed = true

[[tool.uv.index]]
# torch 2.7+ Blackwell wheels live in the cu128 index (RTX 5060 Ti = sm_120).
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests"]
